---
name: Codex workspace checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-checks:
    name: Repo-local checks and linters
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js for markdownlint
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Python lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff yamllint pyyaml

      - name: Install markdownlint
        run: npm install --global markdownlint-cli

      - name: Ruff check
        run: ruff check tools --output-format=github

      - name: Ruff format check
        run: ruff format --check tools

      - name: YAML lint
        run: yamllint --config-file .yamllint.yaml .

      - name: Markdown lint
        run: markdownlint --config .markdownlint.yaml '**/*.md'

      - name: Codex workspace checks
        run: python tools/run_codex_checks.py --skip-index
